<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Houseofmahi | Exclusive Women Jewelry & Beauty Collection Bangladesh</title>
    
    <!-- Primary Technical & Search Engine Metadata -->
    <meta name="description" content="Discover premium handcrafted women jewelry, bridal necklaces, earrings, and beauty collections at House of Mahi Bangladesh. Fast delivery across Bangladesh." />
    <meta name="keywords" content="House of Mahi, women jewelry Bangladesh, bridal jewelry Dhaka, necklace, earrings, kundan, handcrafted jewelry" />
    <meta name="author" content="House of Mahi" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://houseofmahibd.com" />
    
    <!-- Official House of Mahi Favicon & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- PWA Web App Manifest & Mobile Metadata -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4A1525" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="House of Mahi" />
    <meta name="application-name" content="House of Mahi" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="House of Mahi" />
    <meta property="og:title" content="Houseofmahi | Exclusive Women Jewelry & Beauty Collection Bangladesh" />
    <meta property="og:description" content="Discover premium handcrafted women jewelry, bridal necklaces, earrings, and beauty collections at House of Mahi Bangladesh. Fast delivery across Bangladesh." />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="House of Mahi Jewelry & Beauty Collection" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@houseofmahi" />
    <meta name="twitter:title" content="Houseofmahi | Exclusive Women Jewelry & Beauty Collection Bangladesh" />
    <meta name="twitter:description" content="Discover premium handcrafted women jewelry, bridal necklaces, earrings, and beauty collections at House of Mahi Bangladesh." />

    <meta name="twitter:image:alt" content="House of Mahi Jewelry Collection" />

    <!-- Organization & WebSite JSON-LD Structured Data for Search Engines -->
    <script type="application/ld+json" id="houseofmahi-initial-schema">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://houseofmahibd.com/#organization",
            "name": "House of Mahi",
            "url": "https://houseofmahibd.com",
            "logo": "https://houseofmahibd.com/icon-512.png",
            "sameAs": [
              "https://www.facebook.com/houseofmahi",
              "https://www.instagram.com/houseofmahi"
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+8801700000000",
              "contactType": "Customer Service",
              "areaServed": "BD",
              "availableLanguage": ["Bengali", "English"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://houseofmahibd.com/#website",
            "url": "https://houseofmahibd.com",
            "name": "House of Mahi",
            "publisher": {
              "@id": "https://houseofmahibd.com/#organization"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://houseofmahibd.com/shop?search={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- Typography / Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
